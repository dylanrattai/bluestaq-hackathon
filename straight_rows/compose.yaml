x-common: &common
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"     # files written to ./out belong to you, not root
  volumes:
    - ./data:/data:ro                              # dataset is mounted, never baked into the image
    - ./out:/out
    - ./submission:/submission:ro

services:
  evaluator:                                       # paced live replay + API:  docker compose up evaluator
    <<: *common
    build:
      context: ./services/evaluator
    image: straight-rows
    ports:
      - "127.0.0.1:8000:8000"                      # localhost only; open http://localhost:8000/ui
    command: ["python", "main.py", "live", "--data", "/data", "--out", "/out", "--speed", "60", "--port", "8000"]

  batch:                                           # regenerate out/submission.json:  docker compose run --rm batch
    <<: *common
    image: straight-rows
    build:
      context: ./services/evaluator
    command: ["python", "main.py", "batch", "--data", "/data", "--out", "/out"]

  dev:                                             # score against the dev labels:  docker compose run --rm dev
    <<: *common
    image: straight-rows
    build:
      context: ./services/evaluator
    command: ["python", "main.py", "batch", "--dev", "--data", "/data", "--out", "/out"]

  webui:                                           # Vite dev server w/ hot reload:  docker compose up webui
    build:
      context: ./services/webui
    image: straight-rows-webui
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /app
    ports:
      - "127.0.0.1:5173:5173"                      # localhost only; open http://localhost:5173
    volumes:
      - ./services/webui:/app                      # live source, edits hot-reload
      - /app/node_modules                          # keep the image's node_modules, not the host's
      - ./data:/data:ro
      - ./out:/out
    environment:
      HOME: /tmp
      DATA_DIR: /data
      OUT_DIR: /out
